<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">WITHIN REACH Leeds visual identity board</title>
  <desc id="desc">A minimal civic design system showing the wordmark, reach contour symbol, palette, typography, map treatment and core controls.</desc>
  <rect width="1440" height="1024" fill="#F7F8F4"/>
  <g fill="#17211D" font-family="Arial, sans-serif">
    <text x="72" y="94" font-size="18" font-weight="700" letter-spacing="2.4">VISUAL IDENTITY / V1</text>
    <text x="72" y="174" font-size="58" font-weight="700" letter-spacing="-2">WITHIN REACH</text>
    <text x="527" y="174" font-size="28" font-weight="600">— Leeds</text>
    <text x="74" y="216" font-size="24">20 minutes isn’t the same for everyone.</text>
  </g>
  <g transform="translate(1110 68)">
    <path d="M74 12C140 14 207 57 210 121C212 177 168 226 101 230C42 232 3 195 9 139C15 81 21 10 74 12Z" fill="none" stroke="#17211D" stroke-opacity=".45" stroke-width="5" stroke-dasharray="14 12"/>
    <path d="M86 47C136 44 176 74 176 119C176 159 145 192 98 194C55 195 31 168 36 132C42 91 48 50 86 47Z" fill="#DCEDE3" stroke="#236B4A" stroke-width="7"/>
    <circle cx="102" cy="122" r="8" fill="#17211D"/>
  </g>
  <line x1="72" x2="1368" y1="274" y2="274" stroke="#CBD4CE" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
