    <g transform="translate(72 366)"><rect width="148" height="96" rx="10" fill="#17211D"/><text y="126" fill="#17211D" font-size="16">Ink  #17211D</text></g>
    <g transform="translate(244 366)"><rect width="148" height="96" rx="10" fill="#236B4A"/><text y="126" fill="#17211D" font-size="16">Moss  #236B4A</text></g>
    <g transform="translate(416 366)"><rect width="148" height="96" rx="10" fill="#DCEDE3" stroke="#CBD4CE"/><text y="126" fill="#17211D" font-size="16">Reach  #DCEDE3</text></g>
    <g transform="translate(588 366)"><rect width="148" height="96" rx="10" fill="#2F65A7"/><text y="126" fill="#17211D" font-size="16">Route  #2F65A7</text></g>
    <g transform="translate(760 366)"><rect width="148" height="96" rx="10" fill="#A65A00"/><text y="126" fill="#17211D" font-size="16">Caution  #A65A00</text></g>
    <g transform="translate(932 366)"><rect width="148" height="96" rx="10" fill="#B42318"/><text y="126" fill="#17211D" font-size="16">Barrier  #B42318</text></g>
    <g transform="translate(1104 366)"><rect width="148" height="96" rx="10" fill="#CBD4CE"/><text y="126" fill="#17211D" font-size="16">Rule  #CBD4CE</text></g>
  </g>
  <g transform="translate(72 565)" font-family="Arial, sans-serif" fill="#17211D">
    <text font-size="18" font-weight="700" letter-spacing="1.5">TYPE &amp; VOICE</text>
    <text y="66" font-size="38" font-weight="700">Where can I go?</text>
    <text y="110" font-size="22">Plain verbs. Calm evidence. No medical labels.</text>
    <text y="160" font-size="18" font-family="monospace">21 min  •  1.6 km  •  estimated 4.1%</text>
    <text y="220" font-size="17" font-weight="700">VERIFIED</text>
    <text x="116" y="220" font-size="17">Council source · checked 02 Sep 2026</text>
    <text y="258" font-size="17" font-weight="700">UNKNOWN</text>
    <text x="116" y="258" font-size="17">We don’t know whether this section is step-free.</text>
  </g>
  <g transform="translate(820 560)" font-family="Arial, sans-serif">
    <rect width="548" height="366" rx="18" fill="#FFFFFF" stroke="#CBD4CE" stroke-width="2"/>
    <text x="28" y="48" fill="#17211D" font-size="16" font-weight="700" letter-spacing="1">ROUTE CHOICE</text>
    <text x="28" y="94" fill="#17211D" font-size="30" font-weight="700">Easiest</text>
    <text x="424" y="94" fill="#17211D" font-size="20" font-family="monospace">21 min</text>
    <line x1="28" x2="520" y1="116" y2="116" stroke="#CBD4CE"/>
    <text x="28" y="158" fill="#236B4A" font-size="18" font-weight="700">✓ No known steps</text>
    <text x="28" y="196" fill="#17211D" font-size="18">5 known resting places</text>
    <text x="28" y="234" fill="#17211D" font-size="18">Longest known rest gap 184 m</text>
    <text x="28" y="272" fill="#A65A00" font-size="18" font-weight="700">△ Surface known for 82%</text>
    <rect x="28" y="302" width="492" height="44" rx="10" fill="#236B4A"/>
    <text x="274" y="331" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">View easiest route</text>
  </g>
  <text x="72" y="974" fill="#17211D" font-family="Arial, sans-serif" font-size="15">Signature: standard reach = dashed outline / comfortable reach = solid moss field / unknown coverage = hatch + text</text>
</svg>

