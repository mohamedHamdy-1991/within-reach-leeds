services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - /Volumes/Mo.Hamdy/WITHIN_REACH_LEEDS/.runtime/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
  valhalla:
    image: ${VALHALLA_IMAGE:?Set VALHALLA_IMAGE to a tested immutable image digest}
    ports: ["8002:8002"]
    volumes:
      - /Volumes/Mo.Hamdy/WITHIN_REACH_LEEDS/.runtime/valhalla:/custom_files
    profiles: ["router"]

# The worker must set an immutable tested digest before the router profile can start.
