# Zero-minutes policy (Mohamed): no cron. Data refresh is run locally from
# pipelines/ + scripts/ (immutable download -> validate -> quarantine/publish).
name: Data refresh candidate
on:
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Manual reminder only — real refresh runs locally; never auto-activates production data."
